<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Plantilla de portada TikTok — Eduardo Alvarado</title>
  <desc id="desc">Plantilla vertical editorial con espacio para fotografía o fotograma, título de alto impacto, categoría y firma EA.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717" stop-opacity=".08"/>
      <stop offset=".48" stop-color="#171717" stop-opacity=".18"/>
      <stop offset="1" stop-color="#171717" stop-opacity=".94"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#F4F1EA" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Fondo: reemplaza este rectángulo por una imagen/fotograma en tu editor -->
  <rect width="1080" height="1920" fill="#171717"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <rect x="54" y="54" width="972" height="1812" rx="28" fill="none" stroke="#F57C00" stroke-opacity=".7" stroke-width="3"/>
  <!-- Área visual sugerida: sustituir por foto o fotograma -->
  <rect x="96" y="250" width="888" height="920" rx="18" fill="#77736D" fill-opacity=".22" stroke="#F4F1EA" stroke-opacity=".35" stroke-dasharray="12 12" stroke-width="3"/>
  <g fill="#F4F1EA" font-family="Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="540" y="690" font-size="34" letter-spacing="4" opacity=".8">COLOCA AQUÍ TU FOTOGRAMA</text>
    <text x="540" y="744" font-size="23" opacity=".55">Recomendado: rostro, acción o antes/después</text>
  </g>
  <rect x="0" y="1050" width="1080" height="870" fill="url(#shade)"/>
  <!-- Etiqueta de contenido -->
  <rect x="96" y="1210" width="360" height="66" rx="8" fill="#F57C00"/>
  <text x="124" y="1254" fill="#171717" font-family="Montserrat, Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="2">EDICIÓN / TIPS</text>
  <!-- Título editable -->
  <g fill="#F4F1EA" font-family="Montserrat, Arial, sans-serif" font-weight="800">
    <text x="96" y="1400" font-size="92" letter-spacing="-3">TU TÍTULO</text>
    <text x="96" y="1505" font-size="92" letter-spacing="-3">EN DOS LÍNEAS<tspan fill="#F57C00">.</tspan></text>
  </g>
  <text x="100" y="1585" fill="#F4F1EA" opacity=".76" font-family="Roboto, Arial, sans-serif" font-size="34">Una frase breve que despierte curiosidad</text>
  <!-- Firma -->
  <path d="M96 1660H984" stroke="#F4F1EA" stroke-opacity=".35" stroke-width="2"/>
  <g transform="translate(96 1700)">
    <text x="0" y="56" fill="#F4F1EA" font-family="Montserrat, Arial, sans-serif" font-size="47" font-weight="800" letter-spacing="1">EDUARDO ALVARADO<tspan fill="#F57C00">.</tspan></text>
    <text x="2" y="104" fill="#F4F1EA" opacity=".72" font-family="Roboto, Arial, sans-serif" font-size="23" letter-spacing="3">EDICIÓN Y PRODUCCIÓN AUDIOVISUAL</text>
  </g>
  <!-- Guía de interfaz: ocultar/eliminar antes de exportar -->
  <g id="safe-guides" display="none" fill="none" stroke="#00AEEF" stroke-width="3" stroke-dasharray="14 10">
    <rect x="72" y="160" width="790" height="1510"/>
    <path d="M0 960H1080"/>
  </g>
</svg>